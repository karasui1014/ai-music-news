<!--
  セキュリティ設定（CSP: Content Security Policy）
  このページが読み込んでよいものを厳しく制限しています。
  - script-src 'self' … 外部スクリプトもインラインスクリプトも実行しない
  - connect-src 'self' … 自分のサイト以外へは通信しない（記事データはローカルのJSONのみ）
  - img-src 'self' data: … 外部画像を読み込まない（トラッキング画像を防ぐ）
  - frame-ancestors 'none' … 他サイトに iframe で埋め込まれない（クリックジャッキング対策）
  - form-action 'none' … どこにもフォーム送信しない
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
